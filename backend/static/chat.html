<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivaran test chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; font-size: 18px; }
  textarea { width: 100%; height: 6rem; font-size: 18px; padding: .5rem; box-sizing: border-box; }
  button { font-size: 18px; padding: .5rem 1rem; margin: .5rem .5rem .5rem 0; }
  pre { background: #f4f4f4; padding: .75rem; overflow-x: auto; white-space: pre-wrap; }
  .ask { background: #fff4d6; padding: .75rem; border-radius: 6px; }
  .note { color: #a33; }
</style>
</head>
<body>
<h1>Nivaran: test chat</h1>
<p>Type your problem in any language. This page is only for testing Phase 1.</p>
<textarea id="msg" placeholder="My Swiggy order came cold and they didn't refund me."></textarea>
<div>
  <button id="go">Go</button>
  <button id="plan" disabled>Make plan</button>
  <button id="reset">Start over</button>
</div>
<div id="out"></div>
<script>
let thread = [];       // all the user's messages for this problem
let lastCase = null;
const out = document.getElementById("out");
const msg = document.getElementById("msg");
const planBtn = document.getElementById("plan");

function show(html) { out.innerHTML = html; }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

document.getElementById("go").onclick = async () => {
  const text = msg.value.trim();
  if (!text) return;
  thread.push(text);
  msg.value = "";
  show("Working...");
  try {
    const res = await post("/cases/understand", { message: thread.join("\n") });
    lastCase = res.case;
    let html = "";
    if (res.redacted.length) html += `<p class="note">For safety I removed: ${esc(res.redacted.join(", "))}.</p>`;
    if (res.follow_up_question) html += `<p class="ask"><b>Question:</b> ${esc(res.follow_up_question)}<br><small>Type your answer above and press Go.</small></p>`;
    html += `<pre>${esc(JSON.stringify(res.case, null, 2))}</pre>`;
    show(html);
    planBtn.disabled = !lastCase.company;
  } catch (e) { show(`<p class="note">Error: ${esc(e.message)}</p>`); }
};

planBtn.onclick = async () => {
  show("Planning...");
  try {
    const plan = await post("/cases/plan", { case: lastCase });
    show(`<pre>${esc(JSON.stringify(plan, null, 2))}</pre>`);
  } catch (e) { show(`<p class="note">Error: ${esc(e.message)}</p>`); }
};

document.getElementById("reset").onclick = () => { thread = []; lastCase = null; msg.value = ""; planBtn.disabled = true; show(""); };
</script>
</body>
</html>
